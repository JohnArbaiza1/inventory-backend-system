# Nombre del workflow
name: CI Pipeline

# Se ejecuta en push y pull request a main
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalar Docker Compose (ya viene en ubuntu-latest pero esto asegura compatibilidad)
      - name: Check Docker
        run: docker --version && docker compose version

      # 3. Levantar base de datos con tu docker-compose
      - name: Start database
        run: docker compose up -d db

      # 4. Esperar a que PostgreSQL esté listo
      - name: Wait for PostgreSQL
        run: sleep 10

      # 5. Ejecutar migraciones con Flyway desde tu compose
      - name: Run Flyway migrations
        run: docker compose run --rm flyway migrate

      # 6. Instalar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 7. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 8. Ejecutar tests
      - name: Run tests
        run: npm test

      # 9. Apagar contenedores (importante para limpiar CI)
      - name: Shutdown containers
        if: always()
        run: docker compose down -v


