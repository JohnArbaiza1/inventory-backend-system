products:
  get:
    tags:
      - Products
    summary: Obtener todos los productos
    parameters:
      - name: category_id
        in: query
        required: false
        schema:
          type: integer
        description: Filtrar por categoría
        example: 1
      - name: supplier_id
        in: query
        required: false
        schema:
          type: integer
        description: Filtrar por proveedor
        example: 1
    responses:
      '200':
        description: Lista de productos
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../swagger.yaml#/components/schemas/Product'
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              $ref: '../swagger.yaml#/components/schemas/Error'

  post:
    tags:
      - Products
    summary: Crear un producto
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../swagger.yaml#/components/schemas/ProductInput'
    responses:
      '201':
        description: Producto creado exitosamente
        content:
          application/json:
            schema:
              $ref: '../swagger.yaml#/components/schemas/Product'
      '400':
        description: Datos inválidos (precio <= 0, stock < 0, etc.)
        content:
          application/json:
            schema:
              $ref: '../swagger.yaml#/components/schemas/ValidationError'
      '404':
        description: category_id o supplier_id no existe
        content:
          application/json:
            schema:
              $ref: '../swagger.yaml#/components/schemas/Error'

productsById:
  get:
    tags:
      - Products
    summary: Obtener producto por ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 1
    responses:
      '200':
        description: Producto encontrado
        content:
          application/json:
            schema:
              $ref: '../swagger.yaml#/components/schemas/Product'
      '404':
        description: Producto no encontrado
        content:
          application/json:
            schema:
              $ref: '../swagger.yaml#/components/schemas/Error'

  put:
    tags:
      - Products
    summary: Actualizar producto por ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../swagger.yaml#/components/schemas/ProductInput'
    responses:
      '200':
        description: Producto actualizado
        content:
          application/json:
            schema:
              $ref: '../swagger.yaml#/components/schemas/Product'
      '404':
        description: Producto no encontrado
        content:
          application/json:
            schema:
              $ref: '../swagger.yaml#/components/schemas/Error'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '../swagger.yaml#/components/schemas/ValidationError'

  delete:
    tags:
      - Products
    summary: Eliminar producto por ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 1
    responses:
      '204':
        description: Producto eliminado exitosamente
      '404':
        description: Producto no encontrado
        content:
          application/json:
            schema:
              $ref: '../swagger.yaml#/components/schemas/Error'